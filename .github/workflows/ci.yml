name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  typescript:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm exec vitest run

  forge:
    name: Forge manifest and bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npm install -g @forge/cli@15.0.0
      - name: Validate the manifest and bundle with the Forge CLI's own tooling (no login needed)
        run: node scripts/forge-check.cjs apps/forge

  contracts:
    name: Demo contracts (Foundry)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: demo/contracts
    steps:
      - uses: actions/checkout@v5
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: forge build
      - name: Exploit tests (each one proves a planted bug)
        run: forge test -vv
